<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Customer</title>
    <!-- Memuat Supabase JS Client dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 15px;
            background-color: #f4f4f9;
        }
        .table-container {
            max-width: 100%;
            overflow-x: auto;
            background: #fff;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 5px;
        }
        /* Desain Judul Tabel */
        .table-title {
            background-color: #d32f2f;
            color: white;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            padding: 8px;
            border: 1px solid #000;
            border-bottom: none;
            letter-spacing: 1px;
        }
        .action-bar {
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #000;
            padding: 4px 6px;
            text-align: left;
            font-size: 13px;
        }
        th {
            background-color: #d32f2f;
            color: white;
            text-align: center;
            font-size: 13px;
        }
        td input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 13px;
            outline: none;
            padding: 2px 0;
            box-sizing: border-box;
        }
        td input:focus {
            background: #fffde7;
        }
        .text-center {
            text-align: center;
        }
        .text-right {
            text-align: right;
        }
        .btn {
            padding: 6px 12px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 3px;
            font-size: 13px;
        }
        .btn-add {
            background-color: #4CAF50;
            color: white;
        }
        .btn-add:hover {
            background-color: #45a049;
        }
        .btn-save {
            background-color: #2196F3;
            color: white;
        }
        .btn-save:hover {
            background-color: #0b7dda;
        }
        .btn-print {
            background-color: #ff9800;
            color: white;
        }
        .btn-print:hover {
            background-color: #e68a00;
        }
        .btn-delete {
            background-color: #f44336;
            color: white;
            padding: 2px 6px;
            font-size: 12px;
        }
        .btn-delete:hover {
            background-color: #da190b;
        }

        /* Pengaturan khusus saat dicetak (Print) */
        @media print {
            body {
                background-color: white;
                margin: 0;
            }
            .action-bar, .btn-add, .btn-delete, th:last-child, td:last-child {
                display: none !important;
            }
            .table-container {
                box-shadow: none;
                padding: 0;
            }
            td input {
                border: none;
                background: transparent;
            }
        }
    </style>
</head>
<body>

    <div class="table-container">
        <!-- Tombol Aksi -->
        <div class="action-bar">
            <button class="btn btn-add" onclick="tambahBaris()">&#43; Tambah </button>
            <button class="btn btn-save" onclick="saveKeSupabase()">💾 Save </button>
            <button class="btn btn-print" onclick="window.print()">🖨️ Print</button>
        </div>

        <!-- Judul Tabel -->
        <div class="table-title">DATA LIST CUSTOMER </div>

        <table id="customerTable">
            <thead>
                <tr>
                    <th style="width: 3%;">NO</th>
                    <th style="width: 12%;">NPWP</th>
                    <th style="width: 16%;">NAMA PERUSAHAAN</th>
                    <th style="width: 12%;">LOKASI</th>
                    <th style="width: 11%;">KONTAK PERSON</th>
                    <th style="width: 10%;">NO HANDPHONE</th>
                    <th style="width: 6%;">VOLUME/KL</th>
                    <th style="width: 10%;">KETERANGAN</th>
                    <th style="width: 11%;">NAMA BAGIAN SITE</th>
                    <th style="width: 10%;">NO HP SITE</th>
                    <th style="width: 4%;" class="text-center">AKSI</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data akan dimuat otomatis dari Supabase -->
            </tbody>
        </table>
    </div>

    <script>
        // Konfigurasi Supabase
        const SB_URL = "https://qlsvvxfykteqxzcppnfv.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsc3Z2eGZ5a3RlcXh6Y3BwbmZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MDc5OTMsImV4cCI6MjEwNzk4Mzk5M30.jpxErPZSL0sJ4PakUSt8tCxHKHXpmA6CFL9sirbLV2I";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        function updateNomor() {
            const rows = document.querySelectorAll("#tableBody tr");
            rows.forEach((row, index) => {
                row.cells[0].innerText = index + 1;
            });
        }

        // Fungsi tambah baris (bisa diisi data awal jika dari database)
        function tambahBaris(data = {}) {
            const tbody = document.getElementById("tableBody");
            const newRow = document.createElement("tr");
            
            newRow.innerHTML = `
                <td class="text-center"></td>
                <td><input type="text" placeholder="NPWP" value="${data.npwp || ''}"></td>
                <td><input type="text" placeholder="Nama Perusahaan" value="${data.nama_perusahaan || ''}"></td>
                <td><input type="text" placeholder="Lokasi" value="${data.lokasi || ''}"></td>
                <td><input type="text" placeholder="Kontak Person" value="${data.kontak_person || ''}"></td>
                <td><input type="text" placeholder="No Handphone" value="${data.no_handphone || ''}"></td>
                <td><input type="number" value="${data.volume || 0}" class="text-right"></td>
                <td><input type="text" placeholder="Keterangan" value="${data.keterangan || ''}"></td>
                <td><input type="text" placeholder="Nama Bagian Site" value="${data.nama_bagian_site || ''}"></td>
                <td><input type="text" placeholder="No HP Site" value="${data.no_hp_site || ''}"></td>
                <td class="text-center"><button class="btn btn-delete" onclick="hapusBaris(this)">&#8722;</button></td>
            `;
            
            tbody.appendChild(newRow);
            updateNomor();
        }

        function hapusBaris(button) {
            const row = button.closest("tr");
            const tbody = document.getElementById("tableBody");
            
            if (tbody.rows.length > 1) {
                row.remove();
                updateNomor();
            } else {
                alert("Tabel harus menyisakan setidaknya satu baris!");
            }
        }

        // Fungsi Tarik Data (Load) dari Supabase saat halaman dibuka
        async function loadDataDariSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('customers')
                    .select('*')
                    .order('nama_perusahaan', { ascending: true });

                if (error) throw error;

                const tbody = document.getElementById("tableBody");
                tbody.innerHTML = ""; // Bersihkan tabel terlebih dahulu

                if (data && data.length > 0) {
                    data.forEach(item => {
                        tambahBaris(item);
                    });
                } else {
                    // Jika database kosong, tampilkan 1 baris kosong
                    tambahBaris();
                }
            } catch (err) {
                console.error(err);
                alert("Gagal memuat data dari Supabase.");
                tambahBaris();
            }
        }

        // Fungsi Save / Upsert (Simpan baru atau Update jika NPWP sudah ada)
        async function saveKeSupabase() {
            const rows = document.querySelectorAll("#tableBody tr");
            const dataToUpsert = [];

            rows.forEach(row => {
                const inputs = row.querySelectorAll("input");
                dataToUpsert.push({
                    npwp: inputs[0].value,
                    nama_perusahaan: inputs[1].value,
                    lokasi: inputs[2].value,
                    kontak_person: inputs[3].value,
                    no_handphone: inputs[4].value,
                    volume: parseFloat(inputs[5].value) || 0,
                    keterangan: inputs[6].value,
                    nama_bagian_site: inputs[7].value,
                    no_hp_site: inputs[8].value
                });
            });

            try {
                // Menggunakan fungsi upsert berdasarkan kolom 'npwp'
                const { data, error } = await supabaseClient
                    .from('customers')
                    .upsert(dataToUpsert, { onConflict: 'npwp' });

                if (error) throw error;
                alert("Data berhasil disimpan / diperbarui di Supabase!");
                loadDataDariSupabase(); // Refresh tabel setelah simpan
            } catch (err) {
                console.error(err);
                alert("Gagal menyimpan ke Supabase. Pastikan kolom 'npwp' di tabel Supabase sudah diatur sebagai Primary Key atau Unique Constraint.");
            }
        }

        // Jalankan saat halaman selesai dimuat untuk menarik data dari Supabase
        window.onload = function() {
            loadDataDariSupabase();
        };
    </script>

</body>
</html>
